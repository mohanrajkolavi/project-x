<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><title>PromptBlock preview</title>
<style>html,body{margin:0} body{box-sizing:border-box;min-height:100vh;padding:28px 32px}</style>
</head>
<body class="ck-root pal-lagoon hero-sky">
<section class="ck-stack" data-ck-reveal>
  <p class="kicker ck-kicker ck-fade">Prompt 1</p>
  <h2 class="title ck-head" data-ck-words>Reply to any email.</h2>
  <div class="ck-prompt ck-fade">
    <div class="meta ck-prompt__label"><span>Copy this prompt</span><button class="ck-prompt__copy meta" type="button" data-ck-copy><span data-ck-icon="copy" style="display:flex"></span><span>Copy</span></button></div>
    <p class="prompt ck-prompt__text">“Reply to this email in three short lines. Keep <span class="ck-fill">[the tone]</span> and answer <span class="ck-fill">[the question]</span>.”</p>
    <p class="result ck-result">You get · a ready-to-send reply</p>
  </div>
</section>
<script>
Caro.init(document);
</script>
</body>
</html>
