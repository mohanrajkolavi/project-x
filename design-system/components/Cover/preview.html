<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<title>Caro Cosmic Keynote</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--t1); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; }
  .art svg { display: block; width: 480px; height: 288px; overflow: hidden; }
  .sig { fill: var(--sig); }
  .deep { fill: var(--planet-deep); }
  .cyan { fill: var(--lagoon-1); }
  .violet { fill: var(--electric-3); }
  .moon { fill: var(--t1); }
  .pill { rx: var(--radius-lg); }
  .orbit { fill: none; stroke: var(--sig-text); stroke-width: var(--stroke-hairline); opacity: 0.55; }
  .words { position: absolute; left: var(--space-8); bottom: var(--space-8); max-width: 440px; }
  .name { margin: 0; font-size: 64px; line-height: 0.95; font-weight: 700; letter-spacing: -0.04em; color: var(--t1); }
  .tag { margin: var(--space-3) 0 0 2px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--t2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      sig disc r150 bled off the top right (the planet); planet-deep disc r64 inside it as its shadow side; lagoon-1 pill 200x48; electric-3 disc r30; t1 moon r9
  arrangement one large planet with satellites on its orbit, the way the header avatar carries its moon
  pattern     literal motif row: three hairline orbit ellipses (stroke-hairline, sig-text) round the planet, tilted -10deg like art.orbits, because the brand is "an Apple keynote set in deep space"
  scales      pill rx = radius-lg (24px, half the 48px height); text inset = space-8 (64px); tagline gap = space-3
-->
<g transform="rotate(-10 380 40)">
  <ellipse class="orbit" cx="380" cy="40" rx="230" ry="74"></ellipse>
  <ellipse class="orbit" cx="380" cy="40" rx="290" ry="100"></ellipse>
  <ellipse class="orbit" cx="380" cy="40" rx="352" ry="128"></ellipse>
</g>
<circle class="sig" cx="380" cy="40" r="150"></circle>
<circle class="deep" cx="430" cy="92" r="64"></circle>
<rect class="cyan pill" x="96" y="200" width="200" height="48"></rect>
<circle class="violet" cx="62" cy="118" r="30"></circle>
<circle class="moon" cx="214" cy="146" r="9"></circle>
</svg>
</div>
<div class="words">
<p class="name">Caro Cosmic<br>Keynote</p>
<p class="tag">An Apple keynote set in deep space.</p>
</div>
</div>
</body>
</html>
